<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pilotage Tempo par RL – chauffe-eau et batterie</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // Streamlit exécuté dans le navigateur (stlite / Pyodide) : aucun serveur nécessaire.
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.js";
    mount(
      {
        requirements: ["pandas"],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "traces_test.csv": { url: "./traces_test.csv" },
          "bilan_test.csv": { url: "./bilan_test.csv" },
        },
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
